name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
      - run: uv sync --locked
      - run: make validate
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # Barrido de secretos sobre todo el historial (el hook de pre-commit solo ve los cambios)
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact

  # Solo comprueba que la imagen construye; no se publica en ningún registro
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
