name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
      - run: uv sync --locked
      - run: make validate
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # Barrido de secretos sobre todo el historial (el hook de pre-commit solo ve los cambios)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
