[project]
name = "demanda"
version = "0.1.0"
description = "Pronóstico de demanda para reposición en retail, con experimento de promociones, monitor de drift y una capa de agentes que interpreta los resultados."
readme = "README.md"
authors = [
    { name = "javier-laguna", email = "67978779+javier-laguna@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "altair>=6.3.0",
    "chronos-forecasting>=2.3.2",
    "lightgbm>=4.7.0",
    "marimo>=0.25.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandera[polars]>=0.35.0",
    "polars>=2.1.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.6",
    "scipy>=1.18.1",
    "statsforecast>=2.1.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
]

[project.scripts]
demanda = "demanda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el código y la documentación están en español (acentos, «·»)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Viene del store SQLite de MLflow, no de este código
filterwarnings = ["ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# En Linux (Docker, CI) torch sale del índice de CPU de PyTorch, sin las ruedas de CUDA; en macOS, de PyPI
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
